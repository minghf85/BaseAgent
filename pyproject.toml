[project]
name = "baseagent"
version = "0.1.0"
description = "A modular, configurable Claude-Code-style agent harness with 6 tools (Bash, Edit, Read, Write, Glob, Grep), multi-provider support, and an HTTP/SSE server."
readme = "README.md"
authors = [
    { name = "minghf85", email = "3296986532@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "tiktoken>=0.7",
]

[project.scripts]
baseagent = "baseagent.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
